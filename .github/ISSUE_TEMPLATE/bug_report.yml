name: Bug report
description: The API or the website doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The request (method, path, body without tokens), what you expected, and the response you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Against a local server with `seed:local` if you can.
    validations:
      required: true
